name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: linux-cpu
            runner: ubuntu-latest
            binary_name: ocr-snap-linux-cpu
          - flavor: linux-gpu
            runner: ubuntu-latest
            binary_name: ocr-snap-linux-gpu
          - flavor: windows-cpu
            runner: windows-latest
            binary_name: ocr-snap-windows-cpu.exe
          - flavor: windows-gpu
            runner: windows-latest
            binary_name: ocr-snap-windows-gpu.exe
          - flavor: macos-cpu
            runner: macos-latest
            binary_name: ocr-snap-macos-cpu

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3

      - name: Set build flavor
        # Keep FLAVOR_TO_PACKAGE in tools/set_flavor.py in sync with this matrix.
        run: python tools/set_flavor.py ${{ matrix.flavor }}

      - name: Install build dependencies (no paddle)
        run: python -m pip install ".[build]"

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "${{ matrix.binary_name }}" \
            --exclude-module paddle \
            --exclude-module paddleocr \
            --exclude-module tkinter \
            --exclude-module test \
            --exclude-module pydoc_data \
            --collect-all pip \
            src/ocr_snap/__main__.py

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG_MEGA }}

      - name: Upload to MEGA
        shell: bash
        env:
          MEGA_UPLOAD_PATH: ${{ vars.MEGA_UPLOAD_PATH }}
          RELEASE_TAG: ${{ inputs.tag }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          DEST="mega:${MEGA_UPLOAD_PATH}${RELEASE_TAG}/"
          # On macOS, --windowed --onefile produces both ./dist/<name> (single
          # binary) and ./dist/<name>.app/ (bundle dir). We copy the file by
          # path, which rclone resolves as a single-file copy and skips the
          # .app dir — keep this rclone invocation file-targeted, not dir.
          rclone copy "./dist/${BINARY_NAME}" "$DEST" \
            --retries 5 --low-level-retries 20 --transfers 1
          # Verify the upload actually landed; rclone copy can report success
          # without the file appearing remotely under flaky MEGA conditions.
          if ! rclone lsf "$DEST" | grep -qFx "${BINARY_NAME}"; then
            echo "ERROR: ${BINARY_NAME} not found in ${DEST} after upload" >&2
            exit 1
          fi
          echo "Uploaded and verified ${DEST}${BINARY_NAME}" >> "$GITHUB_STEP_SUMMARY"
