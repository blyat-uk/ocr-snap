name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

# Required for the built-in GITHUB_TOKEN to create the release (and tag, on
# manual dispatch when the tag does not yet exist).
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: linux-cpu
            runner: ubuntu-latest
            binary_name: ocr-snap-linux-cpu
          - flavor: linux-gpu
            runner: ubuntu-latest
            binary_name: ocr-snap-linux-gpu
          - flavor: windows-cpu
            runner: windows-latest
            binary_name: ocr-snap-windows-cpu.exe
          - flavor: windows-gpu
            runner: windows-latest
            binary_name: ocr-snap-windows-gpu.exe
          - flavor: macos-cpu
            runner: macos-latest
            binary_name: ocr-snap-macos-cpu

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3

      - name: Set build flavor
        # Keep FLAVOR_TO_PACKAGE in tools/set_flavor.py in sync with this matrix.
        run: python tools/set_flavor.py ${{ matrix.flavor }}

      - name: Install build dependencies (no paddle)
        run: python -m pip install ".[build]"

      - name: Build with PyInstaller
        shell: bash
        run: |
          # paddle/paddleocr are excluded here and pip-installed at first run
          # (runtime_bootstrap), then run on THIS frozen interpreter. Their dep
          # tree (pandas, pydantic, ...) imports stdlib modules the Qt-only app
          # never touches — e.g. zoneinfo — which PyInstaller therefore omits.
          # Force the whole stdlib in so those runtime imports resolve. Computed
          # on the target runner so the module set matches the platform.
          STDLIB_HIDDEN=$(python tools/stdlib_hidden_imports.py)
          pyinstaller \
            --onefile \
            --windowed \
            --name "${{ matrix.binary_name }}" \
            --exclude-module paddle \
            --exclude-module paddleocr \
            --exclude-module tkinter \
            --exclude-module test \
            --exclude-module pydoc_data \
            --collect-all pip \
            $STDLIB_HIDDEN \
            src/ocr_snap/__main__.py

      - name: Publish binary to GitHub Release
        # Each matrix job appends its binary to the same release, keyed by tag.
        # On macOS, --windowed --onefile also emits ./dist/<name>.app/; the
        # literal (wildcard-free) path below matches only the single binary, so
        # the .app bundle is not uploaded.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/${{ matrix.binary_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
