[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-snap"
dynamic = ["version"]
description = "Paste or drop an image, get its text: local PaddleOCR with optional DeepL translation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6>=6.6",
    "numpy",
    "Pillow",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "qtawesome>=1.2",
]

[project.optional-dependencies]
ocr     = ["paddleocr>=3.0", "paddlepaddle>=3.3"]
ocr-gpu = ["paddleocr>=3.0", "paddlepaddle-gpu>=3.3"]
dev     = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
ocr-snap = "ocr_snap.app:main"

[project.urls]
Homepage = "https://github.com/blyat-uk/ocr-snap"
Issues = "https://github.com/blyat-uk/ocr-snap/issues"

[tool.setuptools.dynamic]
version = {attr = "ocr_snap.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocr_snap = ["resources/*.png"]

[tool.mypy]
[[tool.mypy.overrides]]
module = "paddleocr.*"
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
