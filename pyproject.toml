[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-snap"
version = "0.1.0"
description = "Paste/drag-drop images, run PaddleOCR, interact with results"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6>=6.6",
    "numpy",
    "Pillow",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "qtawesome>=1.2",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
ocr     = ["paddleocr>=3.0", "paddlepaddle>=3.3"]
ocr-gpu = ["paddleocr>=3.0", "paddlepaddle-gpu>=3.3"]
dev     = ["pytest>=8.0", "pytest-qt>=4.4", "paddleocr>=3.0", "paddlepaddle>=3.3"]
build   = ["pyinstaller>=6.0", "pip>=24,<26"]

[project.scripts]
ocr-snap = "ocr_snap.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
[[tool.mypy.overrides]]
module = "paddleocr.*"
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
