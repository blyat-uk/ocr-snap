[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-snap"
version = "0.1.0"
description = "Paste/drag-drop images, run PaddleOCR, interact with results"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6>=6.6",
    "paddleocr>=3.0",
    "paddlepaddle>=3.3",
    "numpy",
    "Pillow",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gpu = ["paddlepaddle-gpu>=3.3"]

[project.scripts]
ocr-snap = "ocr_snap.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
[[tool.mypy.overrides]]
module = "paddleocr.*"
ignore_missing_imports = true
follow_untyped_imports = true
